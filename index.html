<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スケジュール管理</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <h1 class="app-title">スケジュール管理</h1>

  <div class="scope-toggle" id="scopeToggle">
    <button type="button" data-scope="work" class="is-active">仕事</button>
    <button type="button" data-scope="private">プライベート</button>
  </div>

  <div class="view-toggle" id="viewToggle">
    <button type="button" data-view="year" class="is-active">年</button>
    <button type="button" data-view="quarter">四半期</button>
    <button type="button" data-view="day">日</button>
  </div>

  <div class="range-nav" id="rangeNav">
    <button id="prevRange" class="icon-btn" title="前へ">‹</button>
    <span id="rangeLabel" class="range-label"></span>
    <button id="nextRange" class="icon-btn" title="次へ">›</button>
  </div>

  <button id="logout" class="logout-btn" title="この端末からログアウト" hidden>ログアウト</button>
</header>

<!-- ログイン画面（未ログインのあいだ、すべての上に被さる） -->
<div class="overlay login-overlay" id="loginOverlay" hidden>
  <form class="dialog login-dialog" id="loginForm">
    <h2 class="dialog-title">スケジュール管理</h2>
    <p class="login-lead">パスワードを入力してください。<br>この端末では次回から聞かれません。</p>
    <label class="field">
      <span class="field-label">パスワード</span>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
    </label>
    <p class="login-error" id="loginError" hidden></p>
    <div class="dialog-actions">
      <button type="submit" class="btn primary" id="loginSubmit">ログイン</button>
    </div>
  </form>
</div>

<!-- ガントビュー（年 / 四半期） -->
<main class="board" id="boardView">
  <!-- チェックした項目に対する操作。高さは常に確保して、出入りで表が上下に動かないようにする -->
  <div class="select-bar" id="selectBar">
    <span class="select-hint" id="selectHint"></span>
    <span class="select-count" id="selectCount" hidden></span>
    <button type="button" class="btn primary select-detail" id="selectDetail" hidden>詳細を見る</button>
    <button type="button" class="btn ghost select-clear" id="selectClear" hidden>選択を解除</button>
  </div>

  <div class="row header-row">
    <div class="head-cell">項目</div>
    <div class="months" id="monthHeader"></div>
  </div>
  <div id="groupList"></div>
  <p class="empty-hint" id="emptyHint">
    下の「＋ 項目を追加」から項目（定例業務・プロジェクト）を追加してください。
  </p>
  <button id="addGroup" class="add-row" title="項目を追加">
    <span class="add-row-plus">＋</span>項目を追加
  </button>
</main>

<!-- 日ビュー（直近のToDo） -->
<section class="todo" id="todoView" hidden></section>

<!-- 項目の新規作成 -->
<div class="overlay" id="groupDialog" hidden>
  <div class="dialog">
    <h2 class="dialog-title">項目を追加</h2>
    <label class="field">
      <span class="field-label">名前</span>
      <input type="text" id="groupName" placeholder="例: マニフェスト精算" autocomplete="off">
    </label>
    <div class="field">
      <span class="field-label">タグ</span>
      <div class="tag-choice">
        <button type="button" class="tag-btn is-active" data-tag="routine">定例</button>
        <button type="button" class="tag-btn" data-tag="project">プロジェクト</button>
      </div>
    </div>
    <div class="field">
      <span class="field-label">色</span>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="groupCancel">キャンセル</button>
      <button type="button" class="btn primary" id="groupSave">追加</button>
    </div>
  </div>
</div>

<!-- 月間カレンダー -->
<div class="overlay" id="calendarOverlay" hidden>
  <div class="dialog calendar-dialog">
    <div class="calendar-head">
      <button class="icon-btn" id="calPrev" title="前の月">‹</button>
      <h2 class="dialog-title" id="calendarTitle"></h2>
      <button class="icon-btn" id="calNext" title="次の月">›</button>
      <button class="today-btn" id="calToday" title="今日を含む月へ">今日</button>
      <span class="calendar-scope" id="calendarScope"></span>
      <button class="icon-btn" id="calendarClose" title="閉じる">×</button>
    </div>
    <p class="calendar-hint" id="calendarHint"></p>
    <div class="calendar" id="calendar"></div>
  </div>
</div>

<!-- 詳細ビュー（選んだ項目の中身をガントで深く設計する） -->
<div class="overlay" id="detailOverlay" hidden>
  <div class="dialog detail-dialog">
    <div class="detail-head">
      <h2 class="dialog-title detail-title" id="detailTitle"></h2>

      <div class="view-toggle" id="detailToggle">
        <button type="button" data-dv="year">年</button>
        <button type="button" data-dv="quarter">四半期</button>
        <button type="button" data-dv="month">月</button>
        <button type="button" data-dv="week">週</button>
      </div>

      <div class="range-nav">
        <button class="icon-btn" id="dvPrev" title="前へ">‹</button>
        <span id="dvRangeLabel" class="range-label"></span>
        <button class="icon-btn" id="dvNext" title="次へ">›</button>
      </div>
      <button class="today-btn" id="dvToday" title="今日を含む期間へ">今日</button>

      <span class="detail-note" id="detailNote"></span>
      <button class="icon-btn" id="detailClose" title="閉じる">×</button>
    </div>

    <div class="detail-axis" id="detailAxis"></div>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<!-- 中タスクの吹き出し -->
<div class="popover" id="popover" hidden></div>

<!-- 右クリックの小窓 -->
<div class="context-menu" id="contextMenu" hidden></div>

<!-- 色を選ぶ小窓 -->
<div class="color-menu" id="colorMenu" hidden></div>

<!-- 並べ替え中の挿入位置 -->
<div class="drop-line" id="dropLine" hidden></div>

<!-- バーにマウスを乗せたときに名前の全文を出す小窓 -->
<div class="tip" id="tip" hidden></div>

<script src="config.js"></script>
<script src="holidays.js"></script>
<script src="auth.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
